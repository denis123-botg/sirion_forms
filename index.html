<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Основные вопросы</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #1e1f22; color: #dbdee1; padding: 15px; margin: 0; }
        .header { display: flex; align-items: center; padding: 10px 0; margin-bottom: 10px; }
        .icon-circle { width: 32px; height: 32px; background-color: #5865f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 12px; }
        .icon-circle:before { content: "≡"; color: white; font-size: 20px; font-weight: bold; }
        h2 { font-size: 20px; margin: 0; color: white; font-weight: 600; }
        
        .warning-box { background-color: rgba(240, 178, 50, 0.1); border: 1px solid #f0b232; border-radius: 8px; padding: 12px; margin-bottom: 20px; display: flex; gap: 10px; }
        .warning-icon { color: #f0b232; font-size: 18px; }
        .warning-text { font-size: 13px; color: #dbdee1; line-height: 1.4; }

        .question { margin-bottom: 25px; }
        .question-title { font-size: 15px; font-weight: 500; margin-bottom: 12px; display: block; }
        .required { color: #f23f42; margin-left: 2px; }

        input[type="text"] { 
            width: 100%; background-color: #000000; border: none; border-radius: 12px; 
            padding: 16px; color: white; box-sizing: border-box; font-size: 15px; margin-top: 5px;
        }

        /* Тот самый список вариантов как в Discord */
        .list-group { background-color: #2b2d31; border-radius: 16px; overflow: hidden; }
        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 16px 20px; border-bottom: 1px solid #3f4147; cursor: pointer;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item span { font-size: 16px; color: white; }
        
        input[type="radio"] { 
            appearance: none; width: 22px; height: 22px; border: 2px solid #b5bac1; 
            border-radius: 50%; outline: none; cursor: pointer; transition: 0.2s;
        }
        input[type="radio"]:checked { border: 6px solid #5865f2; background-color: white; }

        #error_box { 
            display: none; background-color: rgba(242, 63, 66, 0.1); border: 1px solid #f23f42; 
            color: #f23f42; border-radius: 8px; padding: 12px; margin-top: 15px; 
            text-align: center; font-weight: 500; font-size: 14px;
        }

        .submit-btn { 
            background-color: #5865f2; color: white; border: none; padding: 18px; 
            width: 100%; border-radius: 28px; font-size: 16px; font-weight: 600; 
            cursor: pointer; margin-top: 25px; margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="icon-circle"></div>
        <h2>Основные вопросы</h2>
    </div>

    <div class="warning-box">
        <div class="warning-icon">⚠️</div>
        <div class="warning-text">Данная анкета полностью конфиденциальна, информация из неё не будет распространяться без согласия человека, который её заполнял!</div>
    </div>

    <div class="question">
        <label class="question-title">1. Как вас зовут?<span class="required">*</span></label>
        <input type="text" id="q_name" placeholder="Введите имя">
    </div>

    <div class="question">
        <label class="question-title">2. Сколько вам лет?<span class="required">*</span></label>
        <div class="list-group">
            <label class="list-item"><span>10-12 лет</span><input type="radio" name="age" value="10-12"></label>
            <label class="list-item"><span>13-14 лет</span><input type="radio" name="age" value="13-14"></label>
            <label class="list-item"><span>15-16 лет</span><input type="radio" name="age" value="15-16"></label>
            <label class="list-item"><span>17+ лет</span><input type="radio" name="age" value="17+"></label>
        </div>
    </div>

    <div class="question">
        <label class="question-title">3. Ваш уровень РП (1-5)<span class="required">*</span></label>
        <div class="list-group">
            <label class="list-item"><span>1 (Новичок)</span><input type="radio" name="rp" value="1"></label>
            <label class="list-item"><span>3 (Средний)</span><input type="radio" name="rp" value="3"></label>
            <label class="list-item"><span>5 (Профи)</span><input type="radio" name="rp" value="5"></label>
        </div>
    </div>

    <div class="question">
        <label class="question-title">4. Любимые жанры игр?<span class="required">*</span></label>
        <input type="text" id="q_genres">
    </div>

    <div class="question">
        <label class="question-title">5. В какие игры любите играть?<span class="required">*</span></label>
        <input type="text" id="q_games">
    </div>

    <div class="question">
        <label class="question-title">6. С чего играете? (ПК/ТЕЛ)<span class="required">*</span></label>
        <input type="text" id="q_device">
    </div>

    <div class="question">
        <label class="question-title">Ваш Discord ID<span class="required">*</span></label>
        <input type="text" id="q_uid" placeholder="Обязательно для выдачи роли">
    </div>

    <div id="error_box">Нужно заполнить все пункты!</div>
    <button class="submit-btn" onclick="send()">Отправить</button>

    <script>
        async function send() {
            const name = document.getElementById('q_name').value;
            const age = document.querySelector('input[name="age"]:checked')?.value;
            const rp = document.querySelector('input[name="rp"]:checked')?.value;
            const genres = document.getElementById('q_genres').value;
            const games = document.getElementById('q_games').value;
            const device = document.getElementById('q_device').value;
            const uid = document.getElementById('q_uid').value;

            if(!name || !age || !rp || !genres || !games || !device || !uid) {
                document.getElementById('error_box').style.display = 'block';
                return;
            }

            const hook = "https://discord.com/api/webhooks/1499715836221587477/HNFHtnWfTLcAkXCB3LA0zXukAJaf7kgHBhFGAYyIckIGiKjh4R4tg9VvXp9mcyiwDT6b";
            
            const data = {
                embeds: [{
                    title: "Новая анкета игрока!",
                    color: 5814783,
                    fields: [
                        { name: "Имя", value: name, inline: true },
                        { name: "Возраст", value: age, inline: true },
                        { name: "РП уровень", value: rp + "/5", inline: true },
                        { name: "Жанры", value: genres },
                        { name: "Игры", value: games },
                        { name: "Устройство", value: device }
                    ],
                    footer: { text: "ID: " + uid }
                }]
            };

            await fetch(hook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
            alert("Анкета отправлена!");
            window.location.reload();
        }
    </script>
</body>
</html>
