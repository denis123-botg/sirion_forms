<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подача анкеты</title>
    <style>
        body { font-family: sans-serif; background: #313338; color: #fff; padding: 20px; }
        .box { background: #2b2d31; padding: 20px; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        .btn { background: #5865f2; color: white; padding: 15px; width: 100%; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .warn { color: #f0b232; font-size: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Анкета игрока</h2>
        <p class="warn">⚠️ Обязательно введите ваш Discord ID, чтобы мы выдали роль!</p>
        
        <label>Ваш Discord ID (цифрами):</label>
        <input type="text" id="uid" placeholder="Напр: 1216754939616039014">
        
        <label>Ваше имя:</label>
        <input type="text" id="name">
        
        <label>О себе (игры, РП):</label>
        <input type="text" id="about">

        <button class="btn" onclick="send()">ОТПРАВИТЬ</button>
    </div>

    <script>
        async function send() {
            const uid = document.getElementById('uid').value;
            const name = document.getElementById('name').value;
            const about = document.getElementById('about').value;

            if(!uid || !name) return alert("Введите ID и Имя!");

            const hook = "https://discord.com/api/webhooks/1499715836221587477/HNFHtnWfTLcAkXCB3LA0zXukAJaf7kgHBhFGAYyIckIGiKjh4R4tg9VvXp9mcyiwDT6b";
            
            const data = {
                embeds: [{
                    title: "Новая анкета игрока!",
                    fields: [
                        { name: "Имя", value: name },
                        { name: "Инфо", value: about }
                    ],
                    footer: { text: "ID: " + uid }
                }]
            };

            await fetch(hook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
            alert("Анкета отправлена!");
            window.location.reload();
        }
    </script>
</body>
</html>
