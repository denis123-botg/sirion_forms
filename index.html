<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Основные вопросы</title>
    <style>
        body { font-family: 'gg sans', sans-serif; background-color: #1e1f22; color: #dbdee1; padding: 16px; margin: 0; }
        .header { display: flex; align-items: center; padding: 8px 0; margin-bottom: 12px; position: relative; }
        .icon-menu { width: 28px; height: 28px; background-color: #5865f2; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 12px; color: white; font-size: 18px; }
        h2 { font-size: 20px; margin: 0; color: white; font-weight: 600; }
        .warning-box { background-color: rgba(240, 178, 50, 0.1); border: 1px solid #f0b232; border-radius: 4px; padding: 12px; margin-bottom: 24px; display: flex; gap: 12px; }
        .warning-icon { color: #f0b232; font-size: 20px; font-weight: bold; }
        .warning-text { font-size: 13px; line-height: 1.5; color: #dbdee1; }
        .question { margin-bottom: 24px; }
        .question-title { font-size: 14px; font-weight: 500; margin-bottom: 12px; display: block; color: #dbdee1; }
        .required { color: #f23f42; margin-left: 2px; }
        input[type="text"] { width: 100%; background-color: #111214; border: none; border-radius: 12px; padding: 16px; color: white; box-sizing: border-box; font-size: 15px; outline: none; }
        .list-group { background-color: #2b2d31; border-radius: 16px; overflow: hidden; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #3f4147; cursor: pointer; }
        .list-item:last-child { border-bottom: none; }
        
        /* Круглые кнопки */
        input[type="radio"], .round-checkbox { appearance: none; width: 22px; height: 22px; border: 2px solid #b5bac1; border-radius: 50%; outline: none; cursor: pointer; position: relative; margin: 0; }
        input[type="radio"]:checked, .round-checkbox:checked { border-color: #5865f2; }
        input[type="radio"]:checked::after, .round-checkbox:checked::after { content: ""; position: absolute; width: 12px; height: 12px; background: #5865f2; border-radius: 50%; top: 3px; left: 3px; }

        #other_device_input { display: none; margin-top: 10px; }
        .submit-btn { background-color: #5865f2; color: white; border: none; padding: 16px; width: 100%; border-radius: 28px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 20px; margin-bottom: 40px; }
        #error_box { display: none; background: rgba(242, 63, 66, 0.1); border: 1px solid #f23f42; color: #f23f42; border-radius: 8px; padding: 12px; margin: 20px 0; text-align: center; }
        .success-screen { text-align: center; padding: 50px 20px; }
        .success-screen h2 { color: #43b581; }
    </style>
</head>
<body id="main-content">
    <div id="form-wrapper">
        <div class="header"><div class="icon-menu">☰</div><h2>Основные вопросы</h2></div>
        <div class="warning-box"><div class="warning-icon">!</div><div class="warning-text">* Ваши данные конфиденциальны и будут использованы исключительно администрацией для рассмотрения заявки на вступление. Мы не передаем информацию третьим лицам.</div></div>
        
        <div class="question"><label class="question-title">1. Как вас зовут? <span class="required">*</span></label><input type="text" id="q_name"></div>
        
        <div class="question">
            <label class="question-title">2. Сколько вам лет? <span class="required">*</span></label>
            <div class="list-group">
                <label class="list-item"><span>10 лет</span><input type="radio" name="age" value="10"></label>
                <label class="list-item"><span>11 лет</span><input type="radio" name="age" value="11"></label>
                <label class="list-item"><span>12 лет</span><input type="radio" name="age" value="12"></label>
                <label class="list-item"><span>13 лет</span><input type="radio" name="age" value="13"></label>
                <label class="list-item"><span>14 лет</span><input type="radio" name="age" value="14"></label>
                <label class="list-item"><span>15 лет</span><input type="radio" name="age" value="15"></label>
                <label class="list-item"><span>16 лет</span><input type="radio" name="age" value="16"></label>
            </div>
        </div>
        
        <div class="question">
            <label class="question-title">3. Как вы оцениваете свое РП-поведение? <span class="required">*</span></label>
            <div class="list-group">
                <label class="list-item"><span>1ур. (Базовый)</span><input type="radio" name="rp" value="1ур (Базовый)"></label>
                <label class="list-item"><span>2ур. (Средний)</span><input type="radio" name="rp" value="2ур (Средний)"></label>
                <label class="list-item"><span>3ур. (Выше среднего)</span><input type="radio" name="rp" value="3ур (Выше среднего)"></label>
                <label class="list-item"><span>4ур. (Высокий)</span><input type="radio" name="rp" value="4ур (Высокий)"></label>
                <label class="list-item"><span>5ур. (Профессионал)</span><input type="radio" name="rp" value="5ур (Профессионал)"></label>
            </div>
        </div>
        
        <div class="question"><label class="question-title">4. Какие жанры игр у вас любимые? <span class="required">*</span></label><input type="text" id="q_genres"></div>
        <div class="question"><label class="question-title">5. В какие игры/режимы любите играть? <span class="required">*</span></label><input type="text" id="q_games"></div>
        <div class="question"><label class="question-title">6. Сколько часов в день вы играете? (В среднем) <span class="required">*</span></label><input type="text" id="q_hours" placeholder="Напр. 3-4 часа"></div>

        <div class="question">
            <label class="question-title">7. Сколько дней в неделю вы играете? (Можно выбрать несколько вариантов) <span class="required">*</span></label>
            <div class="list-group">
                <label class="list-item"><span>Понедельник</span><input type="checkbox" class="round-checkbox" name="days" value="Понедельник"></label>
                <label class="list-item"><span>Вторник</span><input type="checkbox" class="round-checkbox" name="days" value="Вторник"></label>
                <label class="list-item"><span>Среда</span><input type="checkbox" class="round-checkbox" name="days" value="Среда"></label>
                <label class="list-item"><span>Четверг</span><input type="checkbox" class="round-checkbox" name="days" value="Четверг"></label>
                <label class="list-item"><span>Пятница</span><input type="checkbox" class="round-checkbox" name="days" value="Пятница"></label>
                <label class="list-item"><span>Суббота</span><input type="checkbox" class="round-checkbox" name="days" value="Суббота"></label>
                <label class="list-item"><span>Воскресенье</span><input type="checkbox" class="round-checkbox" name="days" value="Воскресенье"></label>
            </div>
        </div>
        
        <div class="question">
            <label class="question-title">8. С какого устройства играете? <span class="required">*</span></label>
            <div class="list-group">
                <label class="list-item"><span>Мобильное устройство</span><input type="radio" name="dev" value="Телефон" onclick="sh(0)"></label>
                <label class="list-item"><span>Ноутбук</span><input type="radio" name="dev" value="Ноутбук" onclick="sh(0)"></label>
                <label class="list-item"><span>ПК</span><input type="radio" name="dev" value="ПК" onclick="sh(0)"></label>
                <label class="list-item"><span>Другое</span><input type="radio" name="dev" value="other" onclick="sh(1)"></label>
            </div>
            <input type="text" id="other_device_input" placeholder="Укажите ваше устройство">
        </div>
        
        <div id="error_box">Нужно заполнить все пункты!</div>
        <button class="submit-btn" onclick="send()">Отправить</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const autoID = params.get('uid') || "Не определен";
        const webhookUrl = "https://discord.com/api/webhooks/1499715836221587477/HNFHtnWfTLcAkXCB3LA0zXukAJaf7kgHBhFGAYyIckIGiKjh4R4tg9VvXp9mcyiwDT6b";

        function sh(v){ document.getElementById('other_device_input').style.display = v ? 'block' : 'none'; }

        async function send() {
            const n = document.getElementById('q_name').value;
            const a = document.querySelector('input[name="age"]:checked')?.value;
            const r = document.querySelector('input[name="rp"]:checked')?.value;
            const g = document.getElementById('q_genres').value;
            const gm = document.getElementById('q_games').value;
            const hrs = document.getElementById('q_hours').value;
            
            const selectedDays = Array.from(document.querySelectorAll('input[name="days"]:checked')).map(cb => cb.value);
            
            const d = document.querySelector('input[name="dev"]:checked')?.value;
            const o = document.getElementById('other_device_input').value;

            if(!n || !a || !r || !g || !gm || !hrs || selectedDays.length === 0 || !d || (d==='other' && !o)) {
                document.getElementById('error_box').style.display = 'block';
                return;
            }

            const device = d === 'other' ? o : d;
            const dysText = selectedDays.join(', ');
            
            const contentText = `📝 **НОВАЯ АНКЕТА ИГРОКА**\n\n` +
                                `👤 **Имя:** ${n}\n` +
                                `🎂 **Возраст:** ${a} лет\n` +
                                `🏆 **РП уровень:** ${r}\n` +
                                `🎮 **Жанры:** ${g}\n` +
                                `🎲 **Игры:** ${gm}\n` +
                                `⏱️ **Часов в день:** ${hrs}\n` +
                                `📅 **Дни активности:** ${dysText}\n` +
                                `📱 **Устройство:** ${device}\n\n` +
                                `ID:${autoID}`;

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ content: contentText })
                });

                if (response.ok) {
                    document.getElementById('main-content').innerHTML = `
                        <div class="success-screen">
                            <h2>✅ Анкета подана!</h2>
                            <p>Вы можете закрыть сайт.</p>
                        </div>
                    `;
                } else {
                    throw new Error();
                }
            } catch (e) {
                alert("Ошибка при отправке. Попробуйте позже.");
            }
        }
    </script>
</body>
</html>
