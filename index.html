<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirion Forms</title>
    <style>
        body { font-family: sans-serif; background-color: #313338; color: #dbdee1; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 500px; background-color: #2b2d31; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { color: #fff; text-align: center; margin-bottom: 20px; }
        
        .q-group { margin-bottom: 18px; }
        label { display: block; color: #b5bac1; font-size: 13px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        
        input[type="text"], select { 
            width: 100%; padding: 12px; background-color: #1e1f22; border: 1px solid #1e1f22; 
            border-radius: 4px; color: #dcddde; font-size: 15px; box-sizing: border-box;
        }
        input:focus { outline: 1px solid #5865f2; }

        .btn { 
            width: 100%; padding: 14px; background-color: #5865f2; color: white; border: none; 
            border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; 
        }
        .btn:hover { background-color: #4752c4; }
        .footer { font-size: 11px; color: #72767d; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sirion Forms</h2>
        
        <div class="q-group">
            <label>1. Как вас зовут?</label>
            <input type="text" id="name">
        </div>

        <div class="q-group">
            <label>2. Сколько вам лет?</label>
            <input type="text" id="age">
        </div>

        <div class="q-group">
            <label>3. Ваш уровень РП (1-5)</label>
            <select id="rp">
                <option value="1">1 (Новичок)</option>
                <option value="2">2</option>
                <option value="3">3 (Средний)</option>
                <option value="4">4</option>
                <option value="5">5 (Профи)</option>
            </select>
        </div>

        <div class="q-group">
            <label>4. Любимые жанры игр?</label>
            <input type="text" id="genres">
        </div>

        <div class="q-group">
            <label>5. В какие игры/режимы любите играть?</label>
            <input type="text" id="games">
        </div>

        <div class="q-group">
            <label>6. С чего играете? (ПК/ТЕЛ)</label>
            <input type="text" id="device">
        </div>

        <div class="q-group">
            <label>Ваш Discord ID (Обязательно)</label>
            <input type="text" id="uid" placeholder="Напр: 1234567890">
        </div>

        <button class="btn" onclick="send()">ОТПРАВИТЬ АНКЕТУ</button>
        <div class="footer">Ваши данные будут отправлены администрации сервера</div>
    </div>

    <script>
        async function send() {
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const rp = document.getElementById('rp').value;
            const genres = document.getElementById('genres').value;
            const games = document.getElementById('games').value;
            const device = document.getElementById('device').value;
            const uid = document.getElementById('uid').value;

            if(!name || !uid) return alert("Заполните Имя и Discord ID!");

            const hook = "https://discord.com/api/webhooks/1499715836221587477/HNFHtnWfTLcAkXCB3LA0zXukAJaf7kgHBhFGAYyIckIGiKjh4R4tg9VvXp9mcyiwDT6b";
            
            const data = {
                embeds: [{
                    title: "📄 Новая анкета игрока!",
                    color: 5806226,
                    fields: [
                        { name: "Имя", value: name, inline: true },
                        { name: "Возраст", value: age, inline: true },
                        { name: "РП", value: rp + "/5", inline: true },
                        { name: "Жанры", value: genres },
                        { name: "Игры", value: games },
                        { name: "Устройство", value: device }
                    ],
                    footer: { text: "ID: " + uid }
                }]
            };

            await fetch(hook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
            alert("Анкета успешно отправлена!");
            window.location.reload();
        }
    </script>
</body>
</html>
