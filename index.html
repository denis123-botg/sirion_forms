<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Основные вопросы</title>
    <style>
        body { font-family: sans-serif; background-color: #1e1f22; color: #dbdee1; padding: 20px; margin: 0; }
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .icon-circle { width: 35px; height: 35px; background-color: #5865f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; color: white; font-weight: bold; }
        h2 { font-size: 20px; color: white; margin: 0; }
        
        .warning-box { background-color: rgba(240, 178, 50, 0.1); border: 1px solid #f0b232; border-radius: 8px; padding: 12px; margin-bottom: 20px; font-size: 13px; line-height: 1.4; }

        .question { margin-bottom: 25px; }
        .question-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; display: block; }
        
        input[type="text"] { width: 100%; background-color: #000000; border: 1px solid #333; border-radius: 10px; padding: 15px; color: white; box-sizing: border-box; font-size: 15px; }

        .list-group { background-color: #2b2d31; border-radius: 12px; overflow: hidden; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #3f4147; }
        .list-item:last-child { border-bottom: none; }
        
        input[type="radio"] { width: 20px; height: 20px; cursor: pointer; }

        #error_box { display: none; background-color: rgba(242, 63, 66, 0.2); border: 1px solid #f23f42; color: #f23f42; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: center; font-weight: bold; }

        /* САМА КНОПКА */
        .submit-btn { 
            background-color: #5865f2; 
            color: white; 
            border: none; 
            padding: 18px; 
            width: 100%; 
            border-radius: 30px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .submit-btn:active { background-color: #4752c4; }
    </style>
</head>
<body>

    <div class="header">
        <div class="icon-circle">?</div>
        <h2>Основные вопросы</h2>
    </div>

    <div class="warning-box">
        ⚠️ Данная анкета полностью конфиденциальна, информация из неё не будет распространяться без согласия человека, который её заполнял!
    </div>

    <div class="question">
        <label class="question-title">1. Как вас зовут?</label>
        <input type="text" id="name">
    </div>

    <div class="question">
        <label class="question-title">2. Сколько вам лет?</label>
        <div class="list-group">
            <label class="list-item"><span>10-12 лет</span><input type="radio" name="age" value="10-12"></label>
            <label class="list-item"><span>13-14 лет</span><input type="radio" name="age" value="13-14"></label>
            <label class="list-item"><span>15-16 лет</span><input type="radio" name="age" value="15-16"></label>
            <label class="list-item"><span>17+ лет</span><input type="radio" name="age" value="17+"></label>
        </div>
    </div>

    <div class="question">
        <label class="question-title">3. Оцените свое РП (1-5)</label>
        <div class="list-group">
            <label class="list-item"><span>1 (Новичок)</span><input type="radio" name="rp" value="1"></label>
            <label class="list-item"><span>3 (Средне)</span><input type="radio" name="rp" value="3"></label>
            <label class="list-item"><span>5 (Профи)</span><input type="radio" name="rp" value="5"></label>
        </div>
    </div>

    <div class="question">
        <label class="question-title">4. Любимые жанры игр?</label>
        <input type="text" id="genres">
    </div>

    <div class="question">
        <label class="question-title">5. С чего играете? (ПК/Тел)</label>
        <input type="text" id="device">
    </div>

    <div id="error_box">Нужно заполнить все пункты!</div>
    
    <button class="submit-btn" onclick="send()">ОТПРАВИТЬ АНКЕТУ</button>

    <script>
        async function send() {
            const n = document.getElementById('name').value;
            const a = document.querySelector('input[name="age"]:checked')?.value;
            const r = document.querySelector('input[name="rp"]:checked')?.value;
            const g = document.getElementById('genres').value;
            const d = document.getElementById('device').value;

            if(!n || !a || !r || !g || !d) {
                document.getElementById('error_box').style.display = 'block';
                return;
            }

            const webhook = "https://discord.com/api/webhooks/1499715836221587477/HNFHtnWfTLcAkXCB3LA0zXukAJaf7kgHBhFGAYyIckIGiKjh4R4tg9VvXp9mcyiwDT6b";
            const data = {
                embeds: [{
                    title: "Новая анкета!",
                    color: 5814783,
                    fields: [
                        {name: "Имя", value: n},
                        {name: "Возраст", value: a},
                        {name: "РП", value: r},
                        {name: "Жанры", value: g},
                        {name: "Устройство", value: d}
                    ]
                }]
            };

            await fetch(webhook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
            alert("Анкета отправлена!");
            window.location.reload();
        }
    </script>
</body>
</html>
