<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Основные вопросы</title>
    <style>
        body { font-family: 'gg sans', sans-serif; background-color: #1e1f22; color: #dbdee1; padding: 16px; margin: 0; }
        .header { display: flex; align-items: center; padding: 8px 0; margin-bottom: 12px; }
        .icon-menu { width: 24px; height: 24px; background-color: #5865f2; border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-right: 12px; color: white; font-weight: bold; }
        h2 { font-size: 20px; margin: 0; color: white; font-weight: 600; }
        
        .warning-box { background-color: rgba(240, 178, 50, 0.1); border: 1px solid #f0b232; border-radius: 8px; padding: 12px; margin-bottom: 24px; display: flex; gap: 12px; }
        .warning-icon { color: #f0b232; font-size: 18px; font-weight: bold; }
        .warning-text { font-size: 13px; line-height: 1.4; }

        .question { margin-bottom: 24px; }
        .question-title { font-size: 14px; font-weight: 500; margin-bottom: 10px; display: block; }
        .required { color: #f23f42; margin-left: 2px; }

        input[type="text"] { 
            width: 100%; background-color: #000000; border: none; border-radius: 12px; 
            padding: 16px; color: white; box-sizing: border-box; font-size: 15px;
        }

        .list-group { background-color: #2b2d31; border-radius: 16px; overflow: hidden; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #3f4147; cursor: pointer; }
        .list-item:last-child { border-bottom: none; }
        
        input[type="radio"] { appearance: none; width: 20px; height: 20px; border: 2px solid #b5bac1; border-radius: 50%; outline: none; cursor: pointer; }
        input[type="radio"]:checked { border: 6px solid #5865f2; background-color: white; }

        #other_input { display: none; margin-top: 10px; }

        /* Красное окошко ошибки */
        #error_msg { 
            display: none; background: rgba(242, 63, 66, 0.1); border: 1px solid #f23f42; 
            color: #f23f42; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 14px;
        }

        .submit-btn { background-color: #5865f2; color: white; border: none; padding: 16px; width: 100%; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 40px; }
    </style>
</head>
<body>

    <div class="header"><div class="icon-menu">≡</div><h2>Основные вопросы</h2></div>

    <div class="warning-box">
        <div class="warning-icon">!</div>
        <div class="warning-text">Данная анкета полностью конфиденциальна, информация из неё не будет распространяться без согласия человека, который её заполнял!</div>
    </div>

    <div class="question">
        <label class="question-title">1. Как вас зовут?<span class="required">*</span></label>
        <input type="text" id="q_name">
    </div>

    <div class="question">
        <label class="question-title">2. Сколько вам лет?</label>
        <div class="list-group">
            <label class="list-item"><span>10-13 лет</span><input type="radio" name="age" value="10-13"></label>
            <label class="list-item"><span>14-16 лет</span><input type="radio" name="age" value="14-16"></label>
            <label class="list-item"><span>17+ лет</span><input type="radio" name="age" value="17+"></label>
        </div>
    </div>

    <div class="question">
        <label class="question-title">3. С какого устройства играете?</label>
        <div class="list-group">
            <label class="list-item"><span>ПК</span><input type="radio" name="dev" value="ПК" onclick="sh(0)"></label>
            <label class="list-item"><span>Мобильное устройство</span><input type="radio" name="dev" value="Тел" onclick="sh(0)"></label>
            <label class="list-item"><span>Ноутбук</span><input type="radio" name="dev" value="Ноут" onclick="sh(0)"></label>
            <label class="list-item"><span>Другое</span><input type="radio" name="dev" value="other" onclick="sh(1)"></label>
        </div>
        <input type="text" id="other_input" placeholder="Напишите свое устройство">
    </div>

    <div class="question">
        <label class="question-title">Ваш Discord ID (или имя пользователя)<span class="required">*</span></label>
        <input type="text" id="q_uid">
    </div>

    <div id="error_msg">Нужно заполнить все пункты!</div>
    <button class="submit-btn" onclick="send()">Отправить</button>

    <script>
        function sh(v){ document.getElementById('other_input').style.display = v ? 'block' : 'none'; }

        async function send() {
            const n = document.getElementById('q_name').value;
            const a = document.querySelector('input[name="age"]:checked')?.value;
            const d = document.querySelector('input[name="dev"]:checked')?.value;
            const u = document.getElementById('q_uid').value;
            const o = document.getElementById('other_input').value;

            if(!n || !a || !d || !u) {
                document.getElementById('error_msg').style.display = 'block';
                return;
            }

            const device = d === 'other' ? o : d;
            const hook = "https://discord.com/api/webhooks/1499715836221587477/HNFHtnWfTLcAkXCB3LA0zXukAJaf7kgHBhFGAYyIckIGiKjh4R4tg9VvXp9mcyiwDT6b";
            
            await fetch(hook, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: "Новая анкета!",
                        fields: [
                            {name: "Имя", value: n, inline: true},
                            {name: "Возраст", value: a, inline: true},
                            {name: "Устройство", value: device}
                        ],
                        footer: { text: "ID: " + u }
                    }]
                })
            });
            alert("Отправлено!");
            window.location.reload();
        }
    </script>
</body>
</html>
