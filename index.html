<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета Sirion</title>
    <style>
        body { font-family: sans-serif; background-color: #36393f; color: white; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 5px; border: none; box-sizing: border-box; font-size: 14px; }
        button { background-color: #5865f2; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #4752c4; }
    </style>
</head>
<body>
    <h2>Анкета игрока</h2>
    
    <div class="form-group">
        <label>Как вас зовут?</label>
        <input type="text" id="name">
    </div>

    <div class="form-group">
        <label>Оценка своего уровня рп поведения: 1ур.(Базовый) 2ур.(Средний) 3ур.(выше Среднего) 4ур. (Высокий) 5ур. (Профессионал)</label>
        <select id="rp_level">
            <option value="1">1ур.(Базовый)</option>
            <option value="2">2ур.(Средний)</option>
            <option value="3">3ур.(выше Среднего)</option>
            <option value="4">4ур.(Высокий)</option>
            <option value="5">5ур.(Профессионал)</option>
        </select>
    </div>

    <div class="form-group">
        <label>В какие жанры игр любите играть(1 жанр минимум):</label>
        <textarea id="genres" rows="2"></textarea>
    </div>

    <div class="form-group">
        <label>В какие игры/режимы в Роблоксе любите играть(минимум 2):</label>
        <textarea id="roblox_modes" rows="2"></textarea>
    </div>

    <div class="form-group">
        <label>С какого устройства играете?</label>
        <select id="device" onchange="checkDevice(this)">
            <option value="Мобильное устройство">Мобильное устройство</option>
            <option value="Ноутбук">Ноутбук</option>
            <option value="ПК">ПК</option>
            <option value="Другое">Другое</option>
        </select>
        <input type="text" id="other_device" style="display:none; margin-top:10px;" placeholder="Напишите свой вариант">
    </div>
