<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Основные вопросы</title>
    <style>
        body { font-family: 'gg sans', sans-serif; background-color: #1e1f22; color: #dbdee1; padding: 16px; margin: 0; }
        .header { display: flex; align-items: center; padding: 8px 0; margin-bottom: 12px; }
        .icon-menu { width: 28px; height: 28px; background-color: #5865f2; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 12px; color: white; }
        h2 { font-size: 20px; margin: 0; color: white; font-weight: 600; }
        .warning-box { background-color: rgba(240, 178, 50, 0.1); border: 1px solid #f0b232; border-radius: 4px; padding: 12px; margin-bottom: 24px; display: flex; gap: 12px; }
        .warning-text { font-size: 13px; line-height: 1.5; color: #dbdee1; }
        .question { margin-bottom: 24px; }
        .question-title { font-size: 14px; font-weight: 500; margin-bottom: 12px; display: block; }
        input[type="text"] { width: 100%; background-color: #111214; border: none; border-radius: 12px; padding: 16px; color: white; box-sizing: border-box; font-size: 15px; outline: none; }
        .list-group { background-color: #2b2d31; border-radius: 16px; overflow: hidden; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #3f4147; cursor: pointer; }
        input[type="radio"] { appearance: none; width: 22px; height: 22px; border: 2px solid #b5bac1; border-radius: 50%; outline: none; cursor: pointer; position: relative; }
        input[type="radio"]:checked { border-color: #5865f2; }
        input[type="radio"]:checked::after { content: ""; position: absolute; width: 12px; height: 12px; background: #5865f2; border-radius: 50%; top: 3px; left: 3px; }
        #other_device_input { display: none; margin-top: 10px; }
        .submit-btn { background-color: #5865f2; color: white; border: none; padding: 16px; width: 100%; border-radius: 28px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 20px; margin-bottom: 40px; }
        #error_box { display: none; background: rgba(242, 63, 66, 0.1); border: 1px solid #f23f42; color: #f23f42; border-radius: 8px; padding: 12px; margin: 20px 0; text-align: center; }
    </style>
</head>
<body>
    <div class="header"><div class="icon-menu">☰</div><h2>Основные вопросы</h2></div>
    <div class="warning-box"><div class="warning-text">Данная анкету полностью конфиденциальна...</div></div>

    <div class="question"><label class="question-title">1. Как вас зовут? *</label><input type="text" id="q_name"></div>

    <div class="question">
        <label class="question-title">2. Сколько вам лет? *</label>
        <div class="list-group">
            <label class="list-item"><span>10 лет</span><input type="radio" name="age" value="10"></label>
            <label class="list-item"><span>11 лет</span><input type="radio" name="age" value="11"></label>
            <label class="list-item"><span>12 лет</span><input type="radio" name="age" value="12"></label>
            <label class="list-item"><span>13 лет</span><input type="radio" name="age" value="13"></label>
            <label class="list-item"><span>14 лет</span><input type="radio" name="age" value="14"></label>
            <label class="list-item"><span>15 лет</span><input type="radio" name="age" value="15"></label>
            <label class="list-item"><span>16 лет</span><input type="radio" name="age" value="16"></label>
        </div>
    </div>

    <div class="question">
        <label class="question-title">3. Как вы оцениваете свое РП-поведение? *</label>
        <div class="list-group">
            <label class="list-item"><span>1ур. (Базовый)</span><input type="radio" name="rp" value="1ур"></label>
            <label class="list-item"><span>3ур. (Средний)</span><input type="radio" name="rp" value="3ур"></label>
            <label class="list-item"><span>5ур. (Профи)</span><input type="radio" name="rp" value="5ур"></label>
        </div>
    </div>

    <div class="question"><label class="question-title">4. Любимые жанры? *</label><input type="text" id="q_genres"></div>
    <div class="question"><label class="question-title">5. В какие игры любите играть? *</label><input type="text" id="q_games"></div>

    <div class="question">
        <label class="question-title">6. Устройство? *</label>
        <div class="list-group">
            <label class="list-item"><span>Телефон</span><input type="radio" name="dev" value="Телефон"></label>
            <label class="list-item"><span>ПК</span><input type="radio" name="dev" value="ПК"></label>
        </div>
    </div>

    <div id="error_box">Нужно заполнить все пункты!</div>
    <button class="submit-btn" onclick="send()">Отправить</button>

    <script>
        const params = new URLSearchParams(window.location.search);
        const autoID = params.get('uid') || "Не определен";

        async function send() {
            const n = document.getElementById('q_name').value;
            const a = document.querySelector('input[name="age"]:checked')?.value;
            const r = document.querySelector('input[name="rp"]:checked')?.value;
            const g = document.getElementById('q_genres').value;
            const gm = document.getElementById('q_games').value;
            const d = document.querySelector('input[name="dev"]:checked')?.value;

            if(!n || !a || !r || !g || !gm || !d) {
                document.getElementById('error_box').style.display = 'block';
                return;
            }

            await fetch("https://discord.com/api/webhooks/1499715836221587477/HNFHtnWfTLcAkXCB3LA0zXukAJaf7kgHBhFGAYyIckIGiKjh4R4tg9VvXp9mcyiwDT6b", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: "📄 Новая анкета!",
                        color: 5814783,
                        fields: [
                            {name: "👤 Имя", value: n, inline: true},
                            {name: "🎂 Возраст", value: a, inline: true},
                            {name: "🏆 РП", value: r, inline: true},
                            {name: "📱 Устройство", value: d}
                        ],
                        footer: { text: "ID: " + autoID }
                    }]
                })
            });
            alert("Анкета отправлена! Можете закрыть окно.");
            window.close();
        }
    </script>
</body>
</html>
